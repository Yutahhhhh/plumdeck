[package]
name = "plumdeck"
version = "0.6.3"
description = "plumdeck Music Library"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plumdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["devtools"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-devtools = "2.0.1"
tauri-plugin-http = "2.5.4"
tauri-plugin-process = "2.3.1"
# Native outbound file drag, so a candidate can be dropped straight onto a
# rekordbox deck. Upstream CrabNebula plugin (Apache-2.0 OR MIT); the JS side is
# invoked directly through `plugin:drag|start_drag` rather than through the
# separately licensed npm wrapper.
tauri-plugin-drag = "2.1.1"
midir = "0.10"
tauri-plugin-deep-link = "2"
# share-musics account bridge for Junction (src/share_musics.rs). reqwest and
# base64 are already in the tree through tauri-plugin-http; keyring keeps the
# refresh token in macOS Keychain / Windows Credential Manager.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# examples/waveform_validation.rs だけが使う実 WKWebView シェル。tauri 2 が内部で
# 使うのと同じ版に固定し、アプリ本体の依存関係は増やさない。
[dev-dependencies]
wry = "0.53"
tao = "0.34"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = "2.6.7"

# macOS external Copy drags also advertise Generic for JUCE drop targets.
[patch.crates-io]
drag = { path = "vendor/drag" }
