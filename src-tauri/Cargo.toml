[package]
name = "plumdeck"
version = "0.6.3"
description = "plumdeck Music Library"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plumdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["devtools"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-devtools = "2.0.1"
tauri-plugin-http = "2.5.4"
tauri-plugin-process = "2.3.1"
# Native outbound file drag, so a candidate can be dropped straight onto a
# rekordbox deck. Upstream CrabNebula plugin (Apache-2.0 OR MIT); the JS side is
# invoked directly through `plugin:drag|start_drag` rather than through the
# separately licensed npm wrapper.
tauri-plugin-drag = "2.1.1"
midir = "0.10"
tauri-plugin-deep-link = "2"
# share-musics account bridge for Junction (src/share_musics.rs). reqwest and
# base64 are already in the tree through tauri-plugin-http; keyring keeps the
# refresh token in macOS Keychain / Windows Credential Manager.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# S13: the Rust backend in-process instead of the Python sidecar. Off until
# the macOS / Windows smoke checks pass (docs/plan/README.md §6).
plumdeck-backend = { path = "crates/plumdeck-backend", optional = true }

[features]
rust-backend = ["dep:plumdeck-backend"]

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# examples/waveform_validation.rs だけが使う実 WKWebView シェル。tauri 2 が内部で
# 使うのと同じ版に固定し、アプリ本体の依存関係は増やさない。
[dev-dependencies]
wry = "0.53"
tao = "0.34"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = "2.6.7"

# macOS external Copy drags also advertise Generic for JUCE drop targets.
[patch.crates-io]
drag = { path = "vendor/drag" }

# Backend port (Rust): src-tauri is the workspace root so target/ and
# Cargo.lock stay where the release scripts expect them.
[workspace]
# `crates/*` would also match the `crates/tools` folder, which is not a package.
members = [".", "crates/plumdeck-*", "crates/tools/*"]
exclude = ["vendor"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91"

# Versions are pinned with '=' so the backend port stays reproducible. Crates
# already in the app's tree reuse the locked version.
[workspace.dependencies]
plumdeck-analysis = { path = "crates/plumdeck-analysis" }
plumdeck-core = { path = "crates/plumdeck-core" }
plumdeck-decode = { path = "crates/plumdeck-decode" }
plumdeck-db = { path = "crates/plumdeck-db" }
plumdeck-domain = { path = "crates/plumdeck-domain" }
plumdeck-dsp = { path = "crates/plumdeck-dsp" }
plumdeck-key = { path = "crates/plumdeck-key" }
plumdeck-media = { path = "crates/plumdeck-media" }
plumdeck-backend = { path = "crates/plumdeck-backend" }
plumdeck-rekordbox = { path = "crates/plumdeck-rekordbox" }

anyhow = "=1.0.100"
base64 = "=0.22.1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log"] }
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "std"] }
# clap 4.6 needs newer proc-macro2/quote than the app has locked.
clap = { version = "=4.5.57", features = ["derive", "env"] }
# DuckDB 1.5.5, the engine the Python backend writes the existing files with.
duckdb = { version = "=1.10505.0", features = ["bundled", "json", "chrono"] }
hex = "=0.4.3"
# Tag reading (MIT OR Apache-2.0); replaces TinyTag/mutagen.
lofty = "=0.25.5"
# The ETag Starlette's FileResponse derives from mtime and size.
md-5 = "=0.10.6"
# zlib inflate for the rekordbox key blob (already locked through flate2).
miniz_oxide = "=0.8.9"
regex = "=1.12.2"
# FFT for the STFT in plumdeck-dsp (MIT OR Apache-2.0; already locked through symphonia).
rustfft = "=6.4.1"
# SQLite with SQLCipher: the analysis-job queue now, rekordbox's encrypted
# master.db later (one libsqlite3-sys may link per build). macOS uses
# CommonCrypto; Windows adds bundled-sqlcipher-vendored-openssl per crate.
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled-sqlcipher", "backup"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json"] }
serde = { version = "=1.0.228", features = ["derive"] }
# float_roundtrip: parse float text to the same double as json.loads and
# pydantic (the default parser is off by one ULP for ~1 in 4 repr strings).
serde_json = { version = "=1.0.145", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "process", "fs"] }
tokio-util = { version = "=0.7.17", default-features = false, features = ["io"] }
tower = { version = "=0.5.2", default-features = false, features = ["util"] }
tower-http = { version = "=0.6.7", default-features = false }
tracing = "=0.1.43"
tracing-subscriber = { version = "=0.3.22", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# Unicode 15.0.0, the same tables as Python 3.12's unicodedata.
unicode-normalization = "=0.1.22"
uuid = { version = "=1.18.1", features = ["v4"] }

[profile.release]
# Handler panics must unwind so the server can answer 500 instead of aborting.
panic = "unwind"
