[package]
name = "plumdeck-rekordbox"
version = "0.1.0"
description = "Read-only access to rekordbox's master.db and ANLZ analysis files"
edition.workspace = true
rust-version.workspace = true
publish = false

# No DuckDB here: this crate must stay usable from the Tauri side and must not
# pull a second DuckDB build into the workspace.
[dependencies]
miniz_oxide.workspace = true
plumdeck-core.workspace = true
rusqlite.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# No system OpenSSL on Windows: build SQLCipher's crypto from source.
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
