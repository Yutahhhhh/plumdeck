[package]
name = "plumdeck-backend"
version = "0.1.0"
description = "Headless plumdeck backend server"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "plumdeck-backend"
path = "src/bin/plumdeck-backend.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws", "multipart"] }
base64.workspace = true
encoding_rs = "=0.8.35"
regex.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
chrono.workspace = true
clap.workspace = true
md-5.workspace = true
plumdeck-core.workspace = true
plumdeck-db.workspace = true
plumdeck-domain.workspace = true
plumdeck-key.workspace = true
plumdeck-media.workspace = true
plumdeck-rekordbox.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["catch-panic"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
