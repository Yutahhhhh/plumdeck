[package]
name = "plumdeck-db"
version = "0.1.0"
description = "DuckDB access for the plumdeck backend"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono.workspace = true
duckdb.workspace = true
plumdeck-core.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# No system OpenSSL on Windows: build SQLCipher's crypto from source.
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
