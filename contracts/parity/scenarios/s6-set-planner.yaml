# S6: the set planner MCP tools (backend/mcp_server/tools/set_planning.py,
# app/services/set_planner_service.py) on the sets fixture. The sides have
# no rekordbox master.db, so the playlist tools answer their "unavailable"
# error; plan_phased_setlist is covered without rekordbox playlists: anchors,
# explicit ids, artists, sound-alikes, the library-wide filter pool,
# approved wordplay targets, exclusions, the opening track, energy/BPM ramps,
# keep_order, saving as a setlist, and the validation errors. Time is
# frozen; the suite db-diffs both libraries (the saved setlist).
name: s6-set-planner
db: fixture
fixture: sets
freeze_now: "2026-05-01 12:34:56.789012"
# Python's similarity query casts every stored vector of the model, so the
# fixture's unparsable one (track 9) would fail it as a database error.
fixture_sql: |
  DELETE FROM track_embeddings WHERE track_id = 9;
steps:
  # ------------------------------------------------------ rekordbox tools
  - name: list playlists without master.db
    mcp: {method: tools/call, params: {name: list_rekordbox_playlists, arguments: {}}}
  - name: list playlists under a folder
    mcp: {method: tools/call, params: {name: list_rekordbox_playlists, arguments: {under: "Folder/Sub", depth: 3}}}
  - name: list playlists bad depth
    mcp: {method: tools/call, params: {name: list_rekordbox_playlists, arguments: {depth: 7}}}
  - name: playlist tracks without master.db
    mcp: {method: tools/call, params: {name: get_rekordbox_playlist_tracks, arguments: {playlist: "Folder/List", recursive: false}}}
  - name: plan from a rekordbox playlist
    mcp: {method: tools/call, params: {name: plan_phased_setlist, arguments: {phases: [{label: Warm, count: 2, rekordbox_playlists: [Folder]}]}}}

  # ------------------------------------------------------------------ plan
  - name: plan from anchors and ids
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          phases:
            - {label: Warm, count: 3, anchor_track_ids: [3], track_ids: [1, 2, 4, 5]}
            - {label: Peak, count: 2, track_ids: [6, 8, 12], energy_start: 0.5, energy_end: 0.9}
  - name: plan by artist
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          phases:
            - {label: Artists, count: 4, artists: [dj, Artist, nobody-at-all]}
  - name: plan by artist with filters
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          phases:
            - {label: Filtered, count: 3, artists: [a], genres: [House, Techno], year_min: 1990, year_max: 2020}
  - name: plan with sound-alikes
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          phases:
            - {label: Similar, count: 5, similar_to_track_ids: [1, 999], similar_per_seed: 3}
  - name: plan expanding sound-alikes
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          phases:
            - {label: Expand, count: 6, track_ids: [2], expand_similar: true}
  - name: plan from the whole library
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          phases:
            - {label: Library, count: 4, bpm_start: 120, bpm_end: 130, energy_start: 0.4}
            - {count: 3, genres: [Drum & Bass], subgenres: [Liquid]}
  - name: plan with exclusions and an opening track
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          exclude_track_ids: [2, 4]
          exclude_artists: ["  dj  ALPHA "]
          opening_track_id: 5
          phases:
            - {label: Open, count: 4, track_ids: [1, 2, 3], artists: [Artist]}
            - {label: Next, count: 3, bpm_start: 170}
  - name: plan wordplay targets with a high bonus
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          wordplay_bonus: 0.8
          phases:
            - {label: Words, count: 4, track_ids: [1, 2]}
  - name: plan without wordplay targets
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          include_wordplay_targets: false
          phases:
            - {label: Words, count: 4, track_ids: [1, 2]}
  - name: plan keeping the order
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          phases:
            - {label: Ordered, count: 4, track_ids: [8, 3, 1, 5], keep_order: true}
  - name: plan a phase with no candidates
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          phases:
            - {label: Nothing, count: 2, genres: [No Such Genre]}
            - {label: Something, count: 1, track_ids: [1]}
  - name: plan and save
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          save_as_setlist_name: Planned set
          phases:
            - {label: Saved, count: 3, track_ids: [1, 3, 5, 8]}
  - name: the saved setlist
    expect_status: 200
    http: {method: GET, path: /api/setlists/4/tracks}

  # ------------------------------------------------------------- errors
  - name: plan without phases
    mcp: {method: tools/call, params: {name: plan_phased_setlist, arguments: {phases: []}}}
  - name: plan with too many phases
    mcp:
      method: tools/call
      params:
        name: plan_phased_setlist
        arguments:
          phases: [{count: 1}, {count: 1}, {count: 1}, {count: 1}, {count: 1}, {count: 1}, {count: 1},
                   {count: 1}, {count: 1}, {count: 1}, {count: 1}, {count: 1}, {count: 1}]
  - name: plan with a bad count
    mcp: {method: tools/call, params: {name: plan_phased_setlist, arguments: {phases: [{label: Bad, count: 0}]}}}
  - name: plan with a float count
    mcp: {method: tools/call, params: {name: plan_phased_setlist, arguments: {phases: [{label: Bad, count: 2.0}]}}}
  - name: plan with a missing count
    mcp: {method: tools/call, params: {name: plan_phased_setlist, arguments: {phases: [{label: Bad}]}}}
  - name: plan with a bad bonus
    mcp: {method: tools/call, params: {name: plan_phased_setlist, arguments: {wordplay_bonus: 1.5, phases: [{count: 1}]}}}
  - name: plan with an unknown opening track
    mcp: {method: tools/call, params: {name: plan_phased_setlist, arguments: {opening_track_id: 999, phases: [{count: 1, track_ids: [1]}]}}}
