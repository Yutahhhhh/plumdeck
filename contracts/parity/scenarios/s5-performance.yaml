    expect_status: 409
    http: {method: PUT, path: /api/tracks/2/performance-metadata, body: {revision: 1}}
  - name: replace with no grid
    expect_status: 200
    http: {method: PUT, path: /api/tracks/10/performance-metadata, body: {revision: 1, cue_points: []}}
  - name: a cue past the duration
    expect_status: 422
    http: {method: PUT, path: /api/tracks/5/performance-metadata, body: {revision: 1, cue_points: [{slot: 0, position_ms: 100.5}]}}
  - name: a loop past the duration
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, loops: [{id: z, start_ms: 0, end_ms: 400000}]}}
  - name: a grid start past the duration
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, beat_grid: {bpm: 120, first_beat_ms: 300500}}}
  - name: beats past the duration
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, beat_grid: {bpm: 120, first_beat_ms: 0, beat_times_ms: [0, 300600]}}}
  - name: duplicate slots
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, cue_points: [{slot: 1, position_ms: 1}, {slot: 1, position_ms: 2}]}}
  - name: duplicate loop ids
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, loops: [{id: a, start_ms: 0, end_ms: 1}, {id: a, start_ms: 2, end_ms: 3}]}}
  - name: slot out of range
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, cue_points: [{slot: 16, position_ms: 1}]}}
  - name: string revision
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: "4"}}
  - name: negative position
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, cue_points: [{slot: 1, position_ms: -1}]}}
  - name: extra key
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, bogus: 1}}
  - name: backwards loop
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, loops: [{id: b, start_ms: 5, end_ms: 5}]}}
  - name: blank loop id
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, loops: [{id: " ", start_ms: 0, end_ms: 5}]}}
  - name: bpm out of range
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, beat_grid: {bpm: 10, first_beat_ms: 0}}}
  - name: unordered beats
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, beat_grid: {bpm: 120, first_beat_ms: 0, beat_times_ms: [0, 0]}}}
  - name: first beat mismatch
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, beat_grid: {bpm: 120, first_beat_ms: 1, beat_times_ms: [0, 10]}}}
  - name: beat numbers length mismatch
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, beat_grid: {bpm: 120, first_beat_ms: 0, beat_times_ms: [0, 10], beat_numbers: [1]}}}
  - name: beat numbers over the bar
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, beat_grid: {bpm: 120, first_beat_ms: 0, beats_per_bar: 3, beat_times_ms: [0, 10], beat_numbers: [1, 4]}}}
  - name: bad grid source
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, beat_grid: {bpm: 120, first_beat_ms: 0, source: other}}}
  - name: label too long
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata, body: {revision: 4, cue_points: [{slot: 1, position_ms: 1, label: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"}]}}
  - name: put on a missing track
    expect_status: 404
    http: {method: PUT, path: /api/tracks/999/performance-metadata, body: {revision: 0}}
  - name: put without a body
    expect_status: 422
    http: {method: PUT, path: /api/tracks/1/performance-metadata}
  - name: summary after the writes
    expect_status: 200
    http: {method: POST, path: /api/tracks/performance-metadata/cue-points, body: {track_ids: [1, 10, 4]}}
  - name: rekordbox cues for one track
    http: {method: POST, path: /api/tracks/1/cues-rekordbox, body: {revision: 4}}
  - name: rekordbox cues for a missing track
    http: {method: POST, path: /api/tracks/999/cues-rekordbox, body: {revision: 0}}
  - name: rekordbox cues need a revision
    expect_status: 422
    http: {method: POST, path: /api/tracks/1/cues-rekordbox, body: {}}
  - name: rekordbox cues for every track
    http: {method: POST, path: /api/tracks/cues-rekordbox/import, body: {}}
  - name: rekordbox bulk import refuses extra keys
    expect_status: 422
    http: {method: POST, path: /api/tracks/cues-rekordbox/import, body: {x: 1}}
  - name: rekordbox grid
    http: {method: POST, path: /api/tracks/1/grid-rekordbox}
  - name: rekordbox grid for a missing track
    http: {method: POST, path: /api/tracks/999/grid-rekordbox}
