# Intentional differences between the Python backend (A) and the Rust port (B)
# (plan §0.4, §4.9). Anything not listed here stays bug-compatible.
#
# plumdeck-parity reads this file: a scenario step tagged
# `deviation: {id, b_status[, b_body]}` must name an entry here; A's answer is
# recorded but not compared and B must answer as declared. The report counts
# such steps by status: approved entries are accepted, proposed ones are
# listed for the owner's decision (B already behaves as proposed).
#
# status: proposed | approved
deviations:
  - id: D-12
    status: proposed
    source: plan §1.5 (Router)
    summary: >
      Unmatched requests answer FastAPI's JSON errors (404 {"detail": "Not Found"},
      405 {"detail": "Method Not Allowed"}, HEAD served by GET routes) instead of
      the MCP mount's text/plain 404. The frontend reads body.detail only from
      JSON, so the visible text stays "Not Found".
    current: B answers text/plain 404 "Not Found" like A (s0-root.yaml).
  - id: D-13
    status: proposed
    source: contracts/http/routes.v5.json outside_openapi
    summary: >
      FastAPI's built-in documentation routes are not ported: GET/HEAD
      /openapi.json, /docs, /docs/oauth2-redirect, /redoc. Nothing in the app
      calls them; B answers them with the unmatched-request 404.
    current: not ported; no scenario covers them.
  - id: D-10
    status: approved
    source: plan §1.4 (gate), §4.9 D-10; src-tauri/crates/plumdeck-db/src/handle.rs
    summary: >
      Backup/restore (the maintenance gate) waits up to 2 s for pooled
      connections and queue accesses to be returned before refusing with
      "データベースを使用中です。処理の完了後に再試行してください"; Python
      refused at once, so a request racing the 2 s WebSocket snapshot made a
      backup fail spuriously. Long-running analysis/import work (an
      activity) makes maintenance refuse at once with
      "解析・取り込みを停止してからバックアップ／復元してください" for every
      kind of task; Python refused only for a running selective analysis or
      ingest and otherwise blocked the backup behind database_activity until
      e.g. a Play import finished. Messages are unchanged.
    current: implemented in plumdeck-db (S1); no HTTP route uses it until S10.
  - id: D-14
    status: approved
    source: plan R1 (design.md W0-05); src-tauri/crates/plumdeck-db/src/schema.rs
    summary: >
      Startup refuses a library whose schema_info.version is newer than 5
      (written by a newer app) before recovery-compaction or any DDL touches
      it, and exits with "Error during database initialization:
      このライブラリは新しいバージョンの plumdeck で更新されています（スキーマ
      vN、このバージョンは v5 まで）。plumdeck を最新版に更新してください".
      Python opened it and ran its v5 DDL and ALTERs against it.
    current: >
      B refuses; plumdeck-parity startup's newer-schema case checks that
      the file stays byte-identical (A is not run for that case).
  - id: D-06
    status: proposed
    source: plan §1.5 (middleware), §4.9 D-06, R15; src-tauri/crates/plumdeck-backend/src/middleware.rs
    summary: >
      Every route refuses requests that did not come from this machine's own
      pages: a Host other than 127.0.0.1, localhost or [::1] (any port) gets
      421 {"detail": "Invalid Host header"}, and an Origin other than a
      loopback http(s) origin or the WebView's (tauri://localhost,
      http(s)://tauri.localhost) gets 403 {"detail": "Invalid Origin header"},
      before CORS runs. Requests without Host or Origin (scripts, MCP hosts)
      pass. Python answered all of them (DNS rebinding and cross-site POSTs
      reached the API, /mcp and the file-writing routes). The WebView, the
      Vite dev server and every loopback client are unaffected.
    current: implemented in plumdeck-backend (S2); s2-middleware.yaml pins B's answers.
  - id: D-01
    status: proposed
    source: plan §5 D-01; backend/infra/repositories/genre_repository.py; src-tauri/crates/plumdeck-db/src/repos/genres.rs
    summary: >
      GET /api/genres/unknown and /api/genres/unknown-ids order by tracks.id.
      Python sent no ORDER BY, so pages taken with LIMIT/OFFSET could skip or
      repeat tracks when DuckDB returned another order. On a library DuckDB
      scans in insertion order the answers are the same.
    current: >
      B orders by id; s3-genres.yaml compares unknown-ids as an unordered
      list and the pages on the fixture (where both orders agree).
  - id: D-15
    status: proposed
    source: owner decision (README §2.5, plan §2.1 Explorer); backend/api/routers/filesystem.py list_directory
    summary: >
      POST /api/fs/list (the File Explorer listing with Hide Analyzed) and the
      Explorer's queue start are not ported: the Explorer UI is removed and
      imports go through drag-and-drop, "曲を追加" and the rekordbox
      collection import. B answers the route with the unmatched-request 404.
    current: not ported; s3-media.yaml pins B's 404.
  - id: D-16
    status: proposed
    source: Starlette FileResponse (mimetypes.guess_type); src-tauri/crates/plumdeck-media/src/mime.rs
    summary: >
      GET /api/stream sends a Content-Type from a fixed table: Python 3.12's
      built-in mimetypes table with the audio types of macOS's
      /etc/apache2/mime.types over it (.flac audio/x-flac, .m4a audio/mp4,
      .aac audio/x-aac, .ogg audio/ogg, ...). Python asked the OS, so the
      type differed by platform (Windows registry, Linux /etc/mime.types).
      The macOS values are what the shipped macOS app sent.
    current: >
      B uses the table; the parity oracle installs the same table
      (tools/parity/oracle_server.py fixed_mimetypes), s3-media.yaml compares
      Content-Type. On Windows the type changes from the registry's value.
  - id: D-02
    status: proposed
    source: plan §2.2; src/services/metadata.ts saveLyrics; backend/app/services/lyrics_app_service.py register_lyrics
    summary: >
      PUT /api/tracks/{track_id}/lyrics is restored: the lyrics editor
      (src/services/metadata.ts) calls it, but the Python route was removed
      and answered 405, so edits were lost. Body {content, language?}
      (track_id in the body is ignored). The write follows register_lyrics
      with overwrite: source 'user', keywords_json and keywords_content_hash
      cleared, updated_at (and created_at for a new row) set to local now; a
      row with the same content, source and language is left as is. Answers
      LyricsRead, 404 "Track not found", 422 for a bad body.
    current: >
      B implements it (unit tests in plumdeck-backend and plumdeck-db);
      s3-lyrics.yaml pins B's 404 and 422 where A answers 405 (steps that
      write would differ in the db-diff by design).
  - id: D-17
    status: proposed
    source: plan §2.1 DROP (no caller); backend/api/routers/setlists.py, backend/api/routers/wordplay.py
    summary: >
      GET /api/setlists/{id}/duration and POST /api/wordplay-pairs are not
      ported: nothing calls the duration route (set_duration stays for MCP),
      and only tests posted wordplay pairs (the MCP tool proposes them
      through the same service rules). B answers both with the
      unmatched-request 404.
    current: not ported; s4-setlists.yaml and s4-wordplay.yaml pin B's 404.
  - id: D-18
    status: proposed
    source: backend/app/services/setlist_app_service.py update_setlist (hasattr/setattr)
    summary: >
      PUT /api/setlists/{id} ignores keys that name Python internals of the
      model (names starting with "_", e.g. __doc__, _sa_instance_state).
      Python set them on the ORM object, with effects from none to a broken
      session. Public model attributes (dict, model_dump, ...) still answer
      500 as setattr raised in Python; model fields are written as before.
    current: B ignores them like unknown keys; no scenario sends one.
  - id: D-19
    status: proposed
    source: backend/app/services/grid_candidate_service.py automatic (_start_on_demand)
    summary: >
      Until S11 ports the analyzer, GET /api/tracks/{id}/performance-metadata
      does not start a background whole-track grid analysis for a track
      without a rekordbox or stored grid; it answers grid_pending false and
      beat_grid null. POST /api/tracks/{id}/grid-analysis and the grid-jobs
      routes come with S11.
    current: temporary; removed when S11 lands.
  - id: D-20
    status: proposed
    source: backend/app/services/waveform_detail_service.py (_cache_dir, np.savez_compressed)
    summary: >
      The detailed-waveform cache is a plain binary file per source in its
      own folder (waveform-detail-rs-v1) instead of NumPy .npz files in
      waveform-detail-v1, and its key leaves out st_ctime_ns (not portable
      to Windows). Both caches are disposable; the answers are the same.
    current: B never reads A's cache; the first request per file decodes again.
  - id: D-21
    status: proposed
    source: backend/api/routers/play.py (CURRENT_TIMESTAMP, column defaults)
    summary: >
      Play routes that stamped rows with DuckDB's CURRENT_TIMESTAMP
      (rekordbox_sources.imported_at, play_sessions.started_at/ended_at,
      setlists.updated_at on entry add/remove) bind the app clock's local
      time instead, like every other stored timestamp in B (plan R3).
    current: values differ only by clock source; scenarios freeze the clock.
  - id: D-22
    status: proposed
    source: backend/mcp_server (FastMCP StreamableHTTP), mcp_server/tools/analysis.py, mcp_server/tools/junction.py, mcp_server/tools/setlists.py
    summary: >
      The MCP server is a small JSON-RPC handler over Streamable HTTP
      (stateless sessions; SSE when the client accepts it) instead of the
      SDK session manager. Until S11/S12, the analysis and Junction tools
      answer a tool error. generate_auto_setlist ignores target_* (the HTTP
      route it shares has none); recommend_next_track with target_* reads
      the paged ranking. Argument validation errors are reported briefly
      instead of pydantic's full text.
    current: temporary for the analysis/Junction tools; the rest is proposed.
  - id: D-23
    status: proposed
    source: backend/app/services/workflow_service.py (create_backup, removable_devices)
    summary: >
      Backups are written by the zip crate (same entries, names, manifest and
      hashes; member order and DEFLATE bytes differ), and the manifest's
      app_version comes from the package.json next to the build. USB device
      discovery on macOS parses `diskutil info` text instead of its plist;
      Windows discovery comes with S13. Ejecting is macOS-only until then.
    current: B's archives restore in A and A's in B (inspect checks hashes, not bytes).
  - id: D-24
    status: proposed
    source: backend/domain/services/analysis (Essentia RhythmExtractor2013, KeyExtractor, Danceability, MusiCNN)
    summary: >
      The Rust analyzer (plumdeck-analysis) is the repository's own NumPy
      light path ported step by step: onset flux and autocorrelation tempo,
      a DP beat tracker with attack alignment, chroma key profiles, and the
      timbre summary of a centred 30-second window, from one 11.025 kHz
      decode. Values differ from Essentia's; results carry their own
      component versions (rust-attacks-v1, rust-chroma-v1, rust-timbre-v1)
      so stored rows say which implementation produced them. Embeddings
      are not computed yet (W1-27/W1-28) and answer an error.
    current: analysis-quality gates (RB-30) and the owner's replay check decide when it becomes the default.
  - id: D-25
    status: proposed
    source: backend/app/services/ingestion_app_service.py, analysis_job_service.py, play_import_service.py
    summary: >
      Import, analysis jobs and Play imports run the Rust analyzer in
      `--analysis-worker` subprocesses. The analysis profile is always the
      single full pipeline (auto/light/full are accepted and recorded but
      no light fallback exists). `.lrc` lyrics are stored but no longer
      written into the audio file's tags during import, and the
      filename-based metadata guess is not ported. Embedding jobs are not
      queued until the Rust MusiCNN lands (W1-28); rows keep "pending".
      Component versions of Python's analyzers count as current, so nothing
      is re-analysed by only_outdated after the switch.
    current: proposed; the embedding part is temporary.
  - id: D-26
    status: proposed
    source: docs/plan/rekordbox-parity.md §8 (RB-03..RB-06)
    summary: >
      Keys are shown in the user's notation (Alphanumeric by default,
      Classic or Open Key) everywhere a key is listed; the Play browser and
      its recommendation panel colour keys against the MASTER deck (Traffic
      Light: green for same / ±1 / relative, yellow for diagonal / +2 when
      enabled); a remembered "key compatibility" switch in Assist and the
      Play recommendation panel, and `camelot: true` on the MCP
      recommend_next_track(_page) and assist_recommend tools, keep same /
      ±1 / relative keys, same first and unknown last. The tool schemas in
      contracts/mcp do not list `camelot` yet (Python had no such argument).
    current: proposed; scores are unchanged, only order and membership.
  - id: D-50
    status: proposed
    source: backend/app/services/workflow_service.py (uuid.uuid4 ids, SQL now()), backend/api/routers/workflows.py (datetime.now(timezone.utc))
    summary: >
      Workflow rows that Python stamps with DuckDB's now() (track_media,
      media repair plans, the operation journal, version groups, presets,
      controller profiles, USB exports) and Play import batches stamp with
      CURRENT_TIMESTAMP (pause/resume/cancel/retry) bind the app clock's local time in
      B (plan R3), and external recordings store the clock's local time
      instead of a UTC-aware datetime. Generated ids (repair-, audio-,
      controller-, usb-, backup- and manual: event keys from uuid4) are
      random on both sides. Parity scenarios compare these values by kind
      only (tolerance mode `generated`, db_deviations).
    current: values differ only by clock source and randomness.
  - id: D-51
    status: proposed
    source: backend/mcp_server/tools/assist.py (like_track_id, like_artist), app/services/assist_app_service.py (_reference_anchor, _likeness)
    summary: >
      The MCP assist_recommend / assist_search / assist_route tools ignore
      the "like X" reference (like_track_id, like_artist): no reference
      summary, no likeness ordering and no missing-reference note. Without
      other filters assist_search answers "検索条件か「〜のような曲」を1つ以上指定してください".
    current: temporary; the reference anchor and likeness scoring are not ported yet.
