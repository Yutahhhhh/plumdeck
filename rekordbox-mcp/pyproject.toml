[project]
name = "rekordbox-mcp"
version = "1.0.0"
description = "MCP server for rekordbox database management with Cue, Playlist, and Analysis features"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "plumdeck Project", email = "horiyuuta@users.noreply.github.com"},
]
keywords = ["mcp", "rekordbox", "dj", "music", "database", "model-context-protocol", "cue", "playlist", "phrase", "vocal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastmcp>=2.11.0",
    "pyrekordbox>=0.4.3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "mutagen>=1.47.0",
    "zstandard>=0.22.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0.0",
    "cryptography>=42.0.0,<51.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
rekordbox-mcp = "rekordbox_mcp.mcp.server:main"
rekordbox-webapi = "rekordbox_mcp.webapi.app:main"
rekordbox-webui = "rekordbox_mcp.webui.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rekordbox_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "COM", "DTZ", "EXE", "FA", "ISC", "ICN", "PD", "PGH", "PIE", "PL", "PT", "Q", "RET", "RSE", "SIM", "T20", "TCH", "TRY", "TID", "UP", "YTT"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ARG001", "ARG002", "B008", "C901", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "EXE002", "FA100", "ISC001", "PD011", "PGH003", "PLW0602", "PT004", "PT006", "PT012", "PT015", "Q000", "RET503", "SIM103", "SIM117", "T201", "T203", "TCH001", "TCH003", "TRY003", "UP006", "UP007", "UP035", "YTT101", "YTT102", "YTT103"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true