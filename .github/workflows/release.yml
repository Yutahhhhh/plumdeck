name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --config src-tauri/tauri.mixxx.conf.json'
            rust_target: 'aarch64-apple-darwin'
            update_platform: 'darwin-aarch64'
          - platform: 'windows-2022'
            args: '--config src-tauri/tauri.windows.conf.json'
            rust_target: 'x86_64-pc-windows-msvc'
            update_platform: 'windows-x86_64'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false

      - name: Validate release tag and updater key
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-artifacts.mjs validate
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target == 'aarch64-apple-darwin' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: install build dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install cmake ninja pkgconf qtbase qt5compat qtsvg qtdeclarative qttranslations portaudio libsndfile libsamplerate rubberband sound-touch chromaprint libebur128 taglib protobuf abseil opus libnice openssl@3 flac libogg libvorbis speex mpg123 googletest

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows-2022'
        with:
          arch: x64

      - name: Build and stage Windows audio engine
        if: matrix.platform == 'windows-2022'
        run: |
          # The MSVC developer environment puts Visual Studio's CMake and Ninja on PATH.
          cmake --version
          ninja --version
          node native/mixxx-engine-host/scripts/build-windows.mjs

      - name: Build and stage macOS audio engine
        if: matrix.platform == 'macos-latest'
        run: |
          bash native/mixxx-engine-host/scripts/build-macos.sh
          bash native/mixxx-engine-host/scripts/stage-macos.sh

      - name: configure production frontend environment
        shell: bash
        run: cp .env.production.example .env.production

      - name: build tauri app
        run: pnpm exec tauri build ${{ matrix.args }}
        env:
          CI: true
          PLUMDECK_SHARE_MUSICS_URL: ${{ secrets.PLUMDECK_SHARE_MUSICS_URL }}

      - name: Exercise the backend API and MCP server
        shell: bash
        run: |
          set -euo pipefail
          # The app embeds the same backend; smoke its headless binary here
          # (Windows also exercises the installed app below).
          # Same target directory as the app build above, so dependencies are reused.
          if [[ "${{ matrix.platform }}" == "windows-2022" ]]; then
            cargo build --release --manifest-path src-tauri/Cargo.toml -p plumdeck-backend --bin plumdeck-backend
            BACKEND=src-tauri/target/release/plumdeck-backend.exe
          else
            cargo build --release --manifest-path src-tauri/Cargo.toml -p plumdeck-backend --bin plumdeck-backend --target ${{ matrix.rust_target }}
            BACKEND=src-tauri/target/${{ matrix.rust_target }}/release/plumdeck-backend
          fi
          node scripts/smoke-backend.mjs "$BACKEND"

      - name: Preserve and verify nested macOS frameworks
        if: matrix.platform == 'macos-latest'
        run: bash native/mixxx-engine-host/scripts/sign-tauri-bundle-macos.sh "$GITHUB_WORKSPACE/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/plumdeck.app"

      - name: verify macOS bundles
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test -d 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/plumdeck.app'
          compgen -G 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg' > /dev/null

      - name: verify Windows bundles
        if: matrix.platform == 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'src-tauri/target/release/bundle/msi/*.msi' > /dev/null
          compgen -G 'src-tauri/target/release/bundle/nsis/*.exe' > /dev/null

      - name: Install and exercise Windows desktop app
        if: matrix.platform == 'windows-2022'
        run: node scripts/smoke-windows-installer.mjs

      - name: Prepare signed update artifacts after final bundle sealing
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-artifacts.mjs ${{ matrix.update_platform }} release-artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PLUMDECK_RELEASE_DOWNLOAD_BASE: ${{ vars.PLUMDECK_RELEASE_DOWNLOAD_BASE }}

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.update_platform }}
          path: release-artifacts/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Require both signed platforms before publishing update metadata
        run: node scripts/release-artifacts.mjs combine release-artifacts
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: release-artifacts/*
          fail_on_unmatched_files: true
