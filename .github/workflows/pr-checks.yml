name: PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.node-version'
      - 'contracts/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'native/**'
      - 'services/junction-signaling/**'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, web build and MIDI/audio tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify signed release artifacts and incomplete-release rejection
        run: node --test scripts/test-release-artifacts.mjs
      - name: MIDI and audio recovery regression tests
        run: node --experimental-strip-types --test src/services/midi/generic-midi.test.mjs src/services/dj-engine/audio-ready.test.mjs src/lib/path-breadcrumbs.test.mjs src/components/docs/topics.test.mjs src/services/junction/control-boundary.test.mjs src/services/junction/exchange-actions.test.mjs src/services/junction/roster-model.test.mjs src/services/junction/turn-state.test.mjs src/services/junction/tracks.test.mjs
      - name: Junction signaling contract tests
        working-directory: services/junction-signaling
        run: npm ci && npm test
      - name: Manual updater state and restart tests
        run: node --experimental-strip-types --test src/services/update-controller.test.mjs
      - name: Play drop routing and waveform manifest compatibility tests
        run: node --experimental-strip-types --test src/services/deck-drop.test.mjs src/services/play-drag-routing.test.mjs src/services/waveform/repository.test.mjs src/services/waveform/three-band.test.mjs
      - name: Edited tempo boundaries and cue persistence
        run: node --experimental-strip-types --test native/dj-engine-host/tests-node/beat-grid-math.test.ts native/dj-engine-host/tests-node/performance-cue-metadata.test.ts
      - name: Waveform backspin detection and JOG weight braking
        run: node --experimental-strip-types --test native/dj-engine-host/tests-node/scratch-release.test.ts
      - name: Play controls logic (loops, tempo, key notation, mixer, shortcuts, PAD FX, protocol)
        run: node --experimental-strip-types --test src/components/play/play-logic.test.mjs src/components/play/pending-grid.test.mjs src/components/play/deck-load-flow.test.mjs src/components/play/keyboard-runtime.test.mjs src/components/play/pad-fx-failures.test.mjs src/services/midi/loop-resize.test.mjs native/dj-engine-host/tests-node/protocol.test.ts native/dj-engine-host/tests-node/ddj1000-pad-pages.test.ts native/dj-engine-host/tests-node/ddj1000.test.ts native/dj-engine-host/tests-node/ddj1000-gesture-state.test.ts native/dj-engine-host/tests-node/ddj1000-display.test.ts
      - name: Engine contract matches the host, simulator and client
        run: node --experimental-strip-types tools/engine-contract/contract.mjs
      - name: Junction specification baseline matches the sources
        run: node tools/junction-spec/baseline.mjs
      - name: Generated key tables
        run: node --experimental-strip-types --test src/lib/keys.generated.test.mjs
      - name: Engine conformance analysis (offline; the audio suite needs BlackHole and a host)
        run: node --test native/mixxx-engine-host/tests/conformance/analysis.test.mjs

  backend-port:
    name: Rust backend port crates and parity tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: backend-port
          cache-on-failure: true
      - name: Test plumdeck-core, -db, -domain, -media, -key, -backend, -analysis and -parity
        working-directory: src-tauri
        # One invocation: testing these packages separately splits host
        # build-dependency features and rebuilds bundled DuckDB per package.
        run: cargo test -p plumdeck-core -p plumdeck-db -p plumdeck-domain -p plumdeck-media -p plumdeck-key -p plumdeck-backend -p plumdeck-analysis -p plumdeck-parity
      - name: Parity against the recorded Python answers
        working-directory: src-tauri
        # The golden files replace the retired Python oracle; detailed
        # waveforms decode through FFmpeg on side B.
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          cargo build -p plumdeck-core -p plumdeck-db -p plumdeck-domain -p plumdeck-media -p plumdeck-key -p plumdeck-backend -p plumdeck-analysis -p plumdeck-parity
          ./target/debug/plumdeck-parity suite --work "$RUNNER_TEMP/parity" --golden ../contracts/parity/golden ../contracts/parity/scenarios/*.yaml
      - name: Test plumdeck-dsp (release; filter quality and no-allocation checks)
        working-directory: src-tauri
        run: cargo test -p plumdeck-dsp --release

  windows-shell:
    name: Windows shell and controller regression tests
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
      - name: Compile and test native Windows shell
        working-directory: src-tauri
        env:
          # Unit tests compile the shell independently; packaging validates real resources.
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo test --lib
      - name: Test the backend port's Python-compat layer on Windows paths
        working-directory: src-tauri
        # No DuckDB here; ntpath, LocalAppData and the CPython vectors only.
        run: cargo test -p plumdeck-core

      - name: Preserve resolved Rust lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cargo-lock
          path: src-tauri/Cargo.lock
