name: PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'backend/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'native/**'
      - 'services/junction-signaling/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, web build and MIDI/audio tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify signed release artifacts and incomplete-release rejection
        run: python scripts/test-release-artifacts.py
      - name: MIDI and audio recovery regression tests
        run: node --experimental-strip-types --test src/services/midi/generic-midi.test.mjs src/services/dj-engine/audio-ready.test.mjs src/lib/path-breadcrumbs.test.mjs src/components/docs/topics.test.mjs src/services/junction/control-boundary.test.mjs src/services/junction/exchange-actions.test.mjs src/services/junction/roster-model.test.mjs src/services/junction/tracks.test.mjs
      - name: Junction signaling contract tests
        working-directory: services/junction-signaling
        run: npm ci && npm test
      - name: Manual updater state and restart tests
        run: node --experimental-strip-types --test src/services/update-controller.test.mjs
      - name: Play drop routing and waveform manifest compatibility tests
        run: node --experimental-strip-types --test src/services/deck-drop.test.mjs src/services/play-drag-routing.test.mjs src/services/waveform/repository.test.mjs
      - name: Edited tempo boundaries and cue persistence
        run: node --experimental-strip-types --test native/dj-engine-host/tests-node/beat-grid-math.test.ts native/dj-engine-host/tests-node/performance-cue-metadata.test.ts
      - name: Waveform backspin detection and JOG weight braking
        run: node --experimental-strip-types --test native/dj-engine-host/tests-node/scratch-release.test.ts

  backend:
    name: Database and import regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-pr.txt
      - run: python -m pip install -r backend/requirements-pr.txt
      - name: Restore verified lightweight inference model
        id: musicnn-model-cache
        uses: actions/cache/restore@v4
        with:
          path: backend/models/msd-musicnn-1.onnx
          key: musicnn-onnx-49668ffec47e52e94b96f45930bb46a28a1368d4bdfb5c05378fa834aca616e1
      - name: Test database integrity without audio inference
        env:
          PYTHONPATH: backend
        run: python -m pytest --confcutdir=backend/tests/workflow_integrity backend/tests/workflow_integrity -q
      - name: Test portable runtime paths
        env:
          PYTHONPATH: backend
        run: python -m pytest --confcutdir=backend/tests/portability backend/tests/portability -q
      - name: Test cue API and resumable rhythm updates
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_rekordbox_cues.py backend/tests/test_playback_grid.py backend/tests/test_analysis_jobs.py -q
      - name: Test lightweight DSP without librosa or model dependencies
        env:
          PYTHONPATH: backend
        run: python -m pytest --confcutdir=backend/tests/portable_audio backend/tests/portable_audio/test_light_analysis.py -q
      - name: Test real lightweight model and whole-track grid in cold workers
        env:
          PYTHONPATH: backend
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install onnxruntime==1.30.0
          if [ "${{ steps.musicnn-model-cache.outputs.cache-hit }}" != "true" ]; then
            python backend/fetch_musicnn_onnx.py
          fi
          python backend/fetch_musicnn_onnx.py --verify-only
          python backend/light_analysis_diagnostic.py
      - name: Test isolated worker progress, timeout and recovery
        env:
          PYTHONPATH: backend
        run: python backend/tests/analysis_process_smoke.py
      - name: Verify attack alignment with the real rhythm analyzer
        env:
          PYTHONPATH: backend
        run: |
          python -m pip install essentia==2.1b6.dev1389 --only-binary=:all:
          python -m pytest --confcutdir=backend/tests/portable_audio backend/tests/portable_audio/test_beat_alignment.py -q

  windows-light-analysis:
    name: Windows light analysis with real model
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-pr.txt
      - name: Restore verified lightweight inference model
        id: musicnn-model-cache
        uses: actions/cache/restore@v4
        with:
          path: backend/models/msd-musicnn-1.onnx
          key: musicnn-onnx-49668ffec47e52e94b96f45930bb46a28a1368d4bdfb5c05378fa834aca616e1
      - run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -r backend/requirements-pr.txt onnxruntime==1.30.0
      - name: Fetch lightweight inference model when uncached
        if: steps.musicnn-model-cache.outputs.cache-hit != 'true'
        run: python backend/fetch_musicnn_onnx.py
      - name: Verify lightweight inference model
        run: python backend/fetch_musicnn_onnx.py --verify-only
      - name: Verify whole-track grid and real embeddings in fresh workers
        env:
          PYTHONPATH: backend
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python backend/light_analysis_diagnostic.py

  windows-shell:
    name: Windows shell and controller regression tests
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
      - name: Create build-only sidecar placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          New-Item -ItemType File -Force src-tauri/bin/plumdeck-server-x86_64-pc-windows-msvc.exe | Out-Null
      - name: Compile and test native Windows shell
        working-directory: src-tauri
        env:
          # Unit tests compile the shell independently; packaging validates real resources.
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo test --lib

      - name: Preserve resolved Rust lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cargo-lock
          path: src-tauri/Cargo.lock
