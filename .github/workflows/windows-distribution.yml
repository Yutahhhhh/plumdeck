name: Windows distribution validation

# Heavy Windows packaging validation. Not a per-PR gate (pr-checks.yml covers
# that); run it on demand or from the release workflow.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    concurrency:
      group: windows-packages-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            native/mixxx-engine-host/build-deps
            native/mixxx-engine-host/upstream
            native/mixxx-engine-host/build-upstream
            native/mixxx-engine-host/stage/PlumdeckMixxxHost
          key: windows-native-stage-v3-${{ hashFiles('native/mixxx-engine-host/scripts/*.mjs', 'native/mixxx-engine-host/cmake/**', 'native/mixxx-engine-host/src/**') }}
          restore-keys: |
            windows-native-stage-v3-
            windows-native-stage-v2-
            windows-native-
      - name: Build and test real native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        # The MSVC developer environment puts Visual Studio's CMake and Ninja on PATH.
        run: |
          cmake --version
          ninja --version
          node native/mixxx-engine-host/scripts/build-windows.mjs
      - name: Smoke cached native engine
        if: steps.native-cache.outputs.cache-hit == 'true'
        run: node native/mixxx-engine-host/scripts/smoke-bundle.mjs native/mixxx-engine-host/stage/PlumdeckMixxxHost/plumdeck-mixxx-engine-host.exe
      - name: Report native payload
        shell: pwsh
        run: |
          $files = Get-ChildItem native/mixxx-engine-host/stage/PlumdeckMixxxHost -Recurse -File
          $bytes = ($files | Measure-Object Length -Sum).Sum
          "### Windows native engine" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "$($files.Count) files, $([math]::Round($bytes / 1MB, 1)) MiB" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/cache/save@v4
        if: success() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            native/mixxx-engine-host/build-deps
            native/mixxx-engine-host/upstream
            native/mixxx-engine-host/build-upstream
            native/mixxx-engine-host/stage/PlumdeckMixxxHost
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-engine
          path: native/mixxx-engine-host/stage/PlumdeckMixxxHost
          if-no-files-found: error

  installer:
    concurrency:
      group: windows-installer-build-${{ github.ref }}
      cancel-in-progress: true
    needs: [native]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-engine
          path: native/mixxx-engine-host/stage/PlumdeckMixxxHost
      - run: pnpm install --frozen-lockfile
      - name: configure production frontend environment
        shell: bash
        run: cp .env.production.example .env.production
      - name: install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: stage bundled FFmpeg
        run: node scripts/packaging-ffmpeg.mjs --target x86_64-pc-windows-msvc
      - run: pnpm exec tauri build --bundles msi --config src-tauri/tauri.windows.conf.json
        env:
          PLUMDECK_SHARE_MUSICS_URL: ${{ secrets.PLUMDECK_SHARE_MUSICS_URL }}
      - name: Install and start desktop app from a relocated Unicode directory
        run: node scripts/smoke-windows-installer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
